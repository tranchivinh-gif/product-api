name: Product API CI Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: 123456
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        env:
          PORT: 3000
          MONGO_URI: mongodb://admin:123456@localhost:27017/productdb?authSource=admin
        run: |
          node server.js > server.log 2>&1 &

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:3000/; then
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Test Product API
        run: |
          curl --fail http://localhost:3000/
