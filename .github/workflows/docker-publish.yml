name: CD - Docker Hub and Local

on:
  workflow_run:
    workflows:
      - Product API CI Production
    types:
      - completed
    branches:
      - main

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: tranchivinh/product-api:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to local Docker Engine
        shell: powershell
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
        run: |
          docker compose -f docker-compose-prod.yaml pull product-api
          docker compose -f docker-compose-prod.yaml up -d

      - name: Verify Product API health
        shell: powershell
        run: |
          $deadline = (Get-Date).AddMinutes(2)

          do {
            $status = docker inspect product-api-prod --format='{{.State.Health.Status}}' 2>$null

            if ($status -eq "healthy") {
              Write-Host "Product API is healthy"
              exit 0
            }

            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          docker compose -f docker-compose-prod.yaml ps
          docker compose -f docker-compose-prod.yaml logs --tail=100 product-api
          exit 1

      - name: Test Product API
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://localhost:3001/" `
            -UseBasicParsing

          if ($response.StatusCode -ne 200) {
            exit 1
          }

          Write-Host "Product API response: $($response.Content)"
